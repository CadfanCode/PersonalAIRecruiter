<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Försvarsmakten | SYSTEMUTVECKLARE VID MUST</title></head><body>
<form onsubmit="return false">
<h2>Personuppgifter</h2>
<label for="n">Namn</label><input id="n">
<label for="e">E-post</label><input id="e" type="email">
<label for="p">Telefon</label><input id="p" type="tel">
<p>Uppgifter om t.ex. skyddad identitet, belastningsregister, läkarintyg och annan känslig information lämnas inte här.</p>
<input id="cv" type="file" aria-label="Ladda upp CV">
<label><input type="checkbox" id="terms" name="acceptterms"> Jag accepterar villkoren för behandling av personuppgifter</label>
<input type="submit" value="Registrera">
<button>Ansök</button>
</form>
<script>
window.__submitted = false; window.__clicks = [];
document.addEventListener("submit", function (e) { e.preventDefault(); window.__submitted = true; }, true);
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a, input[type=submit], input[type=button], [role=button], [role=option]");
  if (t) window.__clicks.push((t.textContent || t.value || "").trim());
}, true);
</script>
</body></html>
