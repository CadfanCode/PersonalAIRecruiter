<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Upload then account</title></head><body>
<form onsubmit="return false">
  <label for="cv">Ladda upp CV</label><input id="cv" type="file">
  <div id="more"></div>
</form>
<script>
document.getElementById("cv").addEventListener("change", function () {
  document.getElementById("more").innerHTML = '<h2>Skapa konto</h2><label for="pw">Lösenord</label><input id="pw" type="password" value="prefilled-secret"><label for="note">Meddelande</label><input id="note">';
});
</script>
<script>
window.__submitted = false; window.__clicks = [];
document.addEventListener("submit", function (e) { e.preventDefault(); window.__submitted = true; }, true);
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a, input[type=submit], input[type=button], [role=button], [role=option]");
  if (t) window.__clicks.push((t.textContent || t.value || "").trim());
}, true);
</script>
</body></html>
