<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Sign in</title></head><body>
<form onsubmit="return false"><h2>Sign in</h2>
<label for="u">E-post</label><input id="u" type="email"><label for="p">Lösenord</label><input id="p" type="password">
<button type="submit">Logga in</button></form>
<script>
window.__submitted = false; window.__clicks = [];
document.addEventListener("submit", function (e) { e.preventDefault(); window.__submitted = true; }, true);
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a, input[type=submit], input[type=button], [role=button], [role=option]");
  if (t) window.__clicks.push((t.textContent || t.value || "").trim());
}, true);
</script>
</body></html>
