<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Skapa konto</title></head><body>
<h1>Skapa konto för att ansöka</h1>
<form onsubmit="return false">
  <label for="fn">Förnamn</label><input id="fn" type="text">
  <label for="ln">Efternamn</label><input id="ln" type="text">
  <label for="em">E-post</label><input id="em" type="email">
  <label for="pw1">Lösenord</label><input id="pw1" type="password">
  <label for="pw2">Bekräfta lösenord</label><input id="pw2" type="password">
  <button type="submit">Skapa konto</button>
</form>
<script>
window.__submitted = false; window.__clicks = [];
document.addEventListener("submit", function (e) { e.preventDefault(); window.__submitted = true; }, true);
</script>
</body></html>
