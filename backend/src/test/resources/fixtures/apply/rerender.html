<!DOCTYPE html><html><head><meta charset="utf-8"><title>Re-rendering form</title></head><body>
<div id="box"></div>
<script>
function render(values) {
  document.getElementById("box").innerHTML =
    '<label for="a">Förnamn</label><input id="a" value="' + (values.a || '') + '">' +
    '<label for="b">Efternamn</label><input id="b" value="' + (values.b || '') + '">';
  document.getElementById("a").addEventListener("input", function (e) {
    var v = e.target.value;
    setTimeout(function () { render({ a: v }); }, 0);   // a framework that rebuilds the DOM on every change
  });
}
render({});
</script>
<script>
window.__submitted = false; window.__clicks = [];
document.addEventListener("submit", function (e) { e.preventDefault(); window.__submitted = true; }, true);
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a, input[type=submit], input[type=button], [role=button], [role=option]");
  if (t) window.__clicks.push((t.textContent || t.value || "").trim());
}, true);
</script>
</body></html>
