<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Aktivitetsrapportera</title></head><body>
<h1>Något helt annat</h1><p>Sidan har ändrats.</p>
<script>
window.__submitted = false; window.__clicks = []; window.__skickaInClicked = false; window.__keys = [];
document.addEventListener("keydown", function (e) { window.__keys.push(e.key); }, true);
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a, input[type=submit], input[type=button], [role=button], [role=option], li");
  if (t) window.__clicks.push((t.textContent || t.value || "").trim());
}, true);
</script>
</body></html>
