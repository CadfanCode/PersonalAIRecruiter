# Builds the JobPilot installers. jpackage cannot cross-build, so each OS builds its own. Only the Linux one has been run by
# hand; macOS (unsigned until a Developer ID certificate is added, so Gatekeeper warns) and Windows are built here for the first time.
name: installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: WiX Toolset (Windows .msi)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress
        shell: bash
      - name: Build the installer
        run: packaging/build-installer.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: jobpilot-${{ runner.os }}
          path: dist/installer/*
